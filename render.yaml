# ========================================================
# Render Infrastructure Blueprint for BarberPro
# One-Click Cloud Deployment Linked to GitHub Repository
# ========================================================

databases:
  # 1. Managed PostgreSQL Database (PostgreSQL 16)
  - name: barber-db
    databaseName: barbershop
    user: barber_user
    region: oregon
    plan: free
    postgresMajorVersion: "16"

services:
  # 2. NestJS Backend REST API & Server-Sent Events (SSE)
  - type: web
    name: barber-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w @barbershop/shared && npm run build -w @barbershop/api
    startCommand: npm run migrate -w @barbershop/api && npm run seed-demo -w @barbershop/api && npm run start -w @barbershop/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barber-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: AUTH_RETURN_TOKENS_IN_BODY
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: DEFAULT_COUNTRY_CODE
        value: "91"

  # 3. Next.js App Router Web Frontend & PWA
  - type: web
    name: barber-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w @barbershop/shared && npm run build -w @barbershop/web
    startCommand: npm run start -w @barbershop/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: API_URL
        fromService:
          type: web
          name: barber-api
          property: host
