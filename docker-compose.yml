services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
      POSTGRES_DB: barbershop
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barbershop"]
      interval: 5s
      retries: 10
  # Production backups: schedule `pg_dump` (cron / managed-DB snapshots). See docs/BACKUP.md
volumes:
  pgdata:
