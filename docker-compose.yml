version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: barbershop_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pw}
      POSTGRES_DB: ${POSTGRES_DB:-barbershop}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-barbershop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - barbershop_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: barbershop_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://barber_app:app_secure_pw@postgres:5432/barbershop}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://postgres:postgres_secure_pw@postgres:5432/barbershop}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod-access-secret-32-chars-minimum-key!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod-refresh-secret-32-chars-minimum-key!!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@barbershop.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-AdminSecurePass#2026}
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - barbershop_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: barbershop_web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - barbershop_net

volumes:
  pgdata:
    driver: local

networks:
  barbershop_net:
    driver: bridge
