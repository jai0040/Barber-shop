version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: barbershop_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-barbershop}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-barbershop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - barbershop_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: barbershop_api_prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
    restart: always
    networks:
      - barbershop_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: barbershop_web_prod
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000
    restart: always
    networks:
      - barbershop_net

  nginx:
    image: nginx:alpine
    container_name: barbershop_nginx_prod
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    networks:
      - barbershop_net

volumes:
  pgdata_prod:
    driver: local

networks:
  barbershop_net:
    driver: bridge
