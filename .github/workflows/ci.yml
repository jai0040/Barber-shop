name: CI/CD Pipeline

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------
  # 1. Typecheck and Lint
  # ----------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Workspaces
        run: npm run lint

  # ----------------------------------------------------
  # 2. Automated Test Suite Execution
  # ----------------------------------------------------
  test:
    name: Automated Test Suites (326 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build -w @barbershop/shared

      - name: Build API Workspace
        run: npm run build -w @barbershop/api

      - name: Run Test Suites
        run: npm test

  # ----------------------------------------------------
  # 3. Next.js Web Frontend Build
  # ----------------------------------------------------
  build-web:
    name: Next.js Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build -w @barbershop/shared

      - name: Build Web Application
        run: npm run build -w @barbershop/web
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ----------------------------------------------------
  # 4. Docker Container Build Verification
  # ----------------------------------------------------
  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build-web]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: barbershop-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: barbershop-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
